<!DOCTYPE html>
<html lang="en">
    <head>
         <meta charset="UTF-8" />
         <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
         <title>Add Members | SABC</title>
         <link rel="icon" type="image/png" href="image001.png"/>
         <link rel="stylesheet" href="style.css" />
         <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <div class="page-wrapper">
            <div class="logo-bar-addMember">
                <img src="image001.png" alt="Logo Brasserie" class="logo-addMember" />
            </div>
            <div class="add-member-card">
                <div class="add-member-header">
                        <h1>Add a Member</h1>
                         <p>Fill in the informations of the Member.</p>
                </div>
                <form class="add-member-form">
                    <div class="form-grid-addMember">
                        <div class="form-group-addMember">
                            <label>First Name</label>
                            <input type="text" id="FirstName" placeholder="Ex: John">
                        </div>
                        <div class="form-group-addMember">
                            <label>Last Name</label>
                            <input type="text" id="LastName" placeholder="Ex: Doe">
                        </div>
                        <div class="form-group-addMember">
                            <label>Email</label>
                            <input type="email" id="Email" placeholder="Ex: john.doe@example.com">
                        </div>
                        <div class="form-group-addMember">
                            <label>Phone Number</label>
                            <input type="tel" id="PhoneNumber" placeholder="Ex: +237645678900">
                        </div>
                        <div class="form-group-addMember">
                            <label>Factory</label>
                            <select id="Factory"> 
                                    <option value="">Select a factory</option>
                            </select>
                        </div>
                        <div class="form-group-addMember">
                            <label>Production lines (Ctrl+click to select multiple)</label>
                            <select id="productionline" multiple> 
                                    <option value="">Select one or more production lines</option>
                            </select>
                        </div>
                        <div class="form-group-addMember">
                            <label>Role</label>
                            <select id="Role">
                                    <option value="">Select a role</option>
                                    <option value="Administrator">Administrator</option>
                                    <option value="Admin-worker">Electrician / Mechanic</option>
                                    <option value="Intern">Intern</option>
                                    <option value="Operator">Operator</option>
                            </select>
                        </div>
                        <div class="form-group-addMember">
                            <label>Password</label>
                            <input type="password" id="Password" placeholder="Enter a password (min 8 characters)">
                        </div>
                        <div class="form-group-addMember">
                            <label>Confirm Password</label>
                            <input type="password" id="ConfirmPassword" placeholder="Confirm your password">
                        </div>
                    </div>
                        <button type="submit" class="create-member-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Member
                        </button>
                </form>
            </div>
            <footer class="footer">
             &copy; 2026, by Kochere Djiomegni for SABC
            </footer>
        </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
        <script src="addMember.js"></script>
    </body>
</html>
