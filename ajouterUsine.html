<!DOCTYPE html>
<html lang="en"> 
    <head>
         <meta charset="UTF-8" />
         <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
         <title>Add Factory | SABC</title>
         <link rel="icon" type="image/png" href="image001.png"/>
         <link rel="stylesheet" href="style.css" />
         <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <div class="page-wrapper"> 
            <div class="logo-bar-addUsine">
                <img src="image001.png" alt="Logo Brasserie" class="logo-addUsine" />
            </div>

            <div class="add-usine-card">
                <div class="add-usine-header">
                    <h1>Add a Factory</h1>
                    <p>Fill in the Factory informations.</p>
                </div>
                <form class="add-usine-form">
                <div class="form-grid-addUsine">
                    <div class="form-group-addUsine">
                        <label>Factory Name</label>
                        <input type="text" id="usineNom" placeholder="Ex: Usine Koumassi">
                    </div>
                    <div class="form-group-addUsine">
                        <label>City</label>
                        <input type="text" id="usineVille" placeholder="Ex: Douala">
                    </div>
                    <div class="form-group-addUsine">
                        <label>Responsable</label>
                        <input type="text" id="usineResponsable" placeholder="Ex: Jean Mbappe">
                    </div>
                    <div class="form-group-addUsine">
                        <label>Sector</label>
                        <input type="text" id="usineSecteur" placeholder="Ex: Food Factory">
                    </div>
                    <div class="form-group-addUsine">
                        <label>Creation Date</label>
                        <input type="date" id="usineDate">
                    </div>
                    <div class="form-group-addUsine">
                        <label>Factory Image</label>
                        <div class="file-drop-zone" id="imageDropZone">
                            <input type="file" id="usineImage" accept="image/*">
                            <span id="imageLabel">📁 Click to upload or drag and drop</span>
                        </div>
                    </div>
                </div>
                <button type="submit" class="create-usine-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Add Factory
                </button>
                </form>
            </div>
            <footer class="footer">
             &copy; 2026, by Kochere Djiomegni for SABC
            </footer>
        </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
        <script src="ajouterUsine.js"></script>
    </body>
</html>
