<!DOCTYPE html>
<html lang="en">
    <head>
         <meta charset="UTF-8" />
         <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
         <title>Add Machine | SABC</title>
         <link rel="icon" type="image/png" href="image001.png"/>
         <link rel="stylesheet" href="style.css" />
         <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <div class="page-wrapper">
             <div class="logo-bar-addMachine">
                <img src="image001.png" alt="Logo Brasserie" class="logo-addMachine" />
            </div>
                <div class="add-machine-card">
                    <div class="add-machine-header">
                        <h1>Add a Machine</h1>
                         <p>Fill in the informations for the machine.</p>
                    </div>
                    <form class="add-machine-form">
                        <div class="form-grid-addMachine">
                            <div class="form-group-addMachine">
                                <label>Machine name</label>
                                <input type="text" id="MachineName" placeholder="Ex: Paramix">
                            </div>
                            <div class="form-group-addMachine">
                                <label>Factory</label>
                                <select id="UsineMachine">
                                    <option value="">Select a factory</option>
                                </select> 
                            </div>
                            <div class="form-group-addMachine">
                                <label>Production line</label>
                                <select id="MachineChaine">
                                    <option value="">Select a production line</option>
                                </select>
                            </div>
                            <div class="form-group-addMachine">
                                <label>Machine Type</label>
                                <input type="text" id="MachineType" placeholder="Ex: Mixing Machine">
                            </div>
                            <div class="form-group-addMachine">
                                <label>Machine Image</label>
                                <div class="file-drop-zone" id="imageDropZone">
                                    <input type="file" id="MachineImage" accept="image/*">
                                    <span id="imageLabel">📁 Click to upload or drag and drop</span>
                                </div>
                            </div>
                            <div class="form-group-addMachine">
                                <label>Manufacturer</label>
                                <input type="text" id="MachineManufacturer" placeholder="Ex: Sidel">
                            </div>
                            <div class="form-group-addMachine">
                                <label>Responsable</label>
                                <input type="text" id="MachineResponsable" placeholder="Ex: Kodi">
                            </div>
                        </div>
                        <button type="submit" class="create-machine-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Machine
                        </button>
                    </form>
                </div>
            <footer class="footer">
                &copy; 2026, by Kochere Djiomegni for SABC
            </footer>
        </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
        <script src="addMachine.js"></script>
    </body>
</html>
